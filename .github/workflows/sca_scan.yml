name: SCA
on:
  push:
    branches: ["master", "v5"]
  pull_request:
    branches: ["master", "v5"]
jobs:
  snyk-cli:
    uses: auth0/devsecops-tooling/.github/workflows/sca-scan.yml@e29f26478db18ff0bcbe4bc447a8fbd54fbeec9e # main on 2026-11-27, TODO: use a release instead
    with:
      ruby-version: "3.4"
      additional-arguments: "--exclude=README.md,.jfrog,examples"
      pre-scan-commands: |
        bundle install
    secrets: inherit