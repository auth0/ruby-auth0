name: Build and Test

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - v5
  push:
    branches:
      - master
      - v5

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/v5' }}

env:
  CACHE_KEY: "${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}"

jobs:
  configure:
    name: Configure Build Matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - id: set-matrix
        run: echo "matrix=$(jq -c . < ./.github/workflows/matrix.json)" >> $GITHUB_OUTPUT

  unit:
    needs: configure

    name: Run Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}

    env:
      BUNDLE_PATH: vendor/bundle

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure Ruby
        uses: ./.github/actions/setup
        with:
          ruby: ${{ matrix.ruby }}

      - name: Run tests
        run: RUN_WIRE_TESTS=true bundle exec rake test

      - name: Upload coverage
        if: matrix.ruby == '3.2' || matrix.ruby == '3.3'
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # pin@6.0.1
